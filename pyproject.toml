[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mentis"
version = "0.1.2"
description = "An AI engineer's toolkit: dataset scanning, model comparison, explainability, auditing, deployment checks, monitoring, and professional reporting behind a single API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Mentis Contributors" }
]
keywords = ["machine-learning", "mlops", "data-quality", "model-comparison", "explainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "jinja2>=3.1",
    "rich>=13.7",
    "typer>=0.9",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.3", "catboost>=1.2"]
explainability = ["shap>=0.44"]
monitoring = ["evidently>=0.4"]
fairness = ["fairlearn>=0.10"]
pdf = ["weasyprint>=61.0"]
all = [
    "mentis[boosting,explainability,monitoring,fairness,pdf]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "mkdocs>=1.5",
]

[project.urls]
Homepage = "https://github.com/your-org/mentis"
Repository = "https://github.com/your-org/mentis"
Issues = "https://github.com/your-org/mentis/issues"

[project.scripts]
mentis = "mentis.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["mentis"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B017", "B007", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true


